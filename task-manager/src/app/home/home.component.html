<div class="home">
    <h2>Bonjour {{ user?.firstName }} 👋</h2>
    <p>Bienvenue dans votre gestionnaire de tâches.</p>
  
    <div class="stats">
      <div class="card">
        <h3>Total des tâches</h3>
        <p>{{ totalTasks }}</p>
      </div>
      <div class="card">
        <h3>Tâches terminées</h3>
        <p>{{ completedTasks }}</p>
      </div>
      <div class="card">
        <h3>En cours</h3>
        <p>{{ inProgressTasks }}</p>
      </div>
    </div>
  </div>
